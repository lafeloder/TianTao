name: Refresh research watchlists weekly

on:
  schedule:
    - cron: '15 6 * * 1'
  workflow_dispatch:

concurrency:
  group: research-watchlists
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evidence parser
        run: pip install -r scripts/watchlists/requirements.txt
      - name: Evidence regression checks
        run: python -m unittest discover -s scripts/watchlists -p 'test_*.py'
      - name: Recheck existing author watchlist and postdoc sources
        run: python scripts/watchlists/refresh.py --fixed-author-list --skip-discovery
      - name: Complete public reference pagination and coverage reconciliation
        run: python scripts/watchlists/benchmarks.py --jobs-only
      - name: Validate public data
        run: python scripts/watchlists/validate.py
      - name: Save evidence and coverage report
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-evidence-report
          path: |
            content/watchlists/review-queue.json
            content/watchlists/run-report.json
            content/watchlists/meta.json
            content/watchlists/coverage-manifest.json
      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/watchlists public/watchlists
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh research watchlist evidence and coverage'
            git push origin HEAD:main
          fi
  deploy:
    needs: refresh
    uses: ./.github/workflows/deploy.yml
    with:
      checkout_ref: main
